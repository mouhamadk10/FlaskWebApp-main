name: Helijao app

on:
  push:
    branches: [ "master" ]

permissions:
  id-token: write
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.9
        uses: actions/setup-python@v3
        with:
          python-version: 3.9

      - name: Message
        run:
          echo "Helijao is deploying this on GitHub"
          echo ${{ secrets.DOCKER_USERNAME}}
